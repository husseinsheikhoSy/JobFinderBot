<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>All Jobs · JOBS204</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --li-blue: #0a66c2;
    --li-blue-dark: #004182;
    --li-blue-light: #eaf3fc;
    --li-bg: #f3f6f8;
    --li-white: #ffffff;
    --li-text: #191919;
    --li-muted: #56687a;
    --li-border: #e3e9ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--li-bg);
    color: var(--li-text);
    min-height: 100vh;
    padding-bottom: 24px;
  }

  .topbar {
    background: linear-gradient(135deg, var(--li-blue), var(--li-blue-dark));
    color: #fff;
    padding: 18px 16px 22px;
    position: sticky; top: 0; z-index: 5;
  }
  .topbar .title { font-size: 17px; font-weight: 700; }
  .topbar .subtitle { font-size: 12.5px; opacity: .85; margin-top: 3px; }

  .filters {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 14px 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    background: var(--li-white);
    border: 1.5px solid var(--li-border);
    color: var(--li-muted);
    font-size: 12.5px; font-weight: 600;
    padding: 7px 13px; border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    background: var(--li-blue);
    border-color: var(--li-blue);
    color: #fff;
  }

  .list { padding: 6px 14px 0; display: flex; flex-direction: column; gap: 10px; }

  .job-card {
    background: var(--li-white);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 10px rgba(10,102,194,.08);
    display: flex; gap: 12px; align-items: flex-start;
    text-decoration: none; color: inherit;
  }
  .job-card:active { background: var(--li-blue-light); }
  .job-logo {
    width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
    background: var(--li-blue-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border: 1px solid var(--li-border);
    object-fit: cover;
  }
  .job-info { flex: 1; min-width: 0; }
  .job-title { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  .job-company { color: var(--li-blue); font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .job-meta { color: var(--li-muted); font-size: 11.5px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .job-meta .dot::before { content: "· "; }
  .job-cat-pill {
    background: var(--li-blue-light); color: var(--li-blue-dark);
    font-size: 10.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 12px;
    align-self: flex-start;
  }

  .state-msg {
    text-align: center; color: var(--li-muted);
    font-size: 13.5px; padding: 40px 20px;
  }

  .footer {
    text-align: center; font-size: 12px; color: var(--li-muted);
    margin: 20px 0 8px;
  }
  .footer a { color: var(--li-blue); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">💼 All Remote Jobs</div>
    <div class="subtitle" id="count-label">Loading opportunities…</div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="list" id="list">
    <div class="state-msg">Loading jobs…</div>
  </div>

  <div class="footer">
    Curated daily from LinkedIn · <a href="https://t.me/Jobs204" target="_blank">@Jobs204</a>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  // ---------------------------------------------------------------
  // Telegram always opens the ONE Mini App URL registered in BotFather
  // (this page), no matter which button was tapped — it only passes
  // start_param along, it never switches which file loads. So this
  // page has to act as the router: if the start_param carries a
  // specific job payload (not "all"/empty), hand off to details.html
  // right away, before doing anything else on this page.
  // ---------------------------------------------------------------
  const routerStartParam = tg?.initDataUnsafe?.start_param
    || new URLSearchParams(window.location.search).get("startapp")
    || new URLSearchParams(window.location.search).get("tgWebAppStartParam");

  if (routerStartParam && routerStartParam !== "all") {
    window.location.replace(`details.html?startapp=${encodeURIComponent(routerStartParam)}`);
  }

  // Public (read-only) Supabase credentials — safe to expose client-side,
  // RLS on linkedin_jobs only allows SELECT with this key.
  const SUPABASE_URL = "https://yfgklalkjldbcykczezt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_rIPkmh5DNK3ZKvW5ygFBXA_2_y0zDeX";

  const CATEGORY_LABELS = {
    python: "🐍 Python",
    ai_ml: "🤖 AI & ML",
    data_science: "📊 Data Science",
    web_dev: "🌐 Web Dev",
    software_eng: "💻 Software Eng",
  };
  const CATEGORY_ORDER = ["python", "ai_ml", "data_science", "web_dev", "software_eng"];

  let allJobs = [];
  let activeFilter = "all";

  function normCategory(c) {
    return (c || "").toString().trim().toLowerCase();
  }

  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function timeAgo(iso) {
    if (!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const hrs = Math.floor(diffMs / 3600000);
    if (hrs < 1) return "just now";
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function renderFilters() {
    const el = document.getElementById("filters");
    const chips = [{ key: "all", label: "All" }, ...CATEGORY_ORDER.map(c => ({ key: c, label: CATEGORY_LABELS[c] }))];
    el.innerHTML = chips.map(c =>
      `<div class="chip ${c.key === activeFilter ? "active" : ""}" data-key="${c.key}">${c.label}</div>`
    ).join("");
    el.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        activeFilter = chip.dataset.key;
        renderFilters();
        renderList();
      });
    });
  }

  function renderList() {
    const listEl = document.getElementById("list");
    const jobs = activeFilter === "all" ? allJobs : allJobs.filter(j => normCategory(j.category) === activeFilter);

    document.getElementById("count-label").textContent =
      allJobs.length ? `${jobs.length} of ${allJobs.length} opportunities` : "No jobs available yet";

    if (!jobs.length) {
      listEl.innerHTML = `<div class="state-msg">No jobs in this category yet — check back soon.</div>`;
      return;
    }

    listEl.innerHTML = jobs.map(job => {
      const logo = job.company_logo
        ? `<img class="job-logo" src="${esc(job.company_logo)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'job-logo',textContent:'💼'}))" />`
        : `<div class="job-logo">💼</div>`;
      const catLabel = CATEGORY_LABELS[job.category] || "💼 Job";
      return `
        <a class="job-card" href="details.html?startapp=${encodeURIComponent(btoa(JSON.stringify({
          id: job.job_id, t: job.title, c: job.company, l: job.location,
          u: job.job_url, cat: job.category, img: job.company_logo || ""
        })))}">
          ${logo}
          <div class="job-info">
            <div class="job-title">${esc(job.title)}</div>
            <div class="job-company">${esc(job.company)}</div>
            <div class="job-meta">
              <span>📍 ${esc(job.location || "Remote")}</span>
              <span class="dot">🌐 Remote</span>
              <span class="dot">${esc(timeAgo(job.fetched_at))}</span>
            </div>
          </div>
          <div class="job-cat-pill">${catLabel}</div>
        </a>`;
    }).join("");
  }

  async function loadJobs() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/linkedin_jobs?select=job_id,title,company,company_logo,location,job_url,category,fetched_at&order=fetched_at.desc&limit=200`,
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      if (!res.ok) throw new Error(`Supabase returned ${res.status}`);
      allJobs = await res.json();
    } catch (e) {
      document.getElementById("count-label").textContent = "Couldn't load jobs";
      document.getElementById("list").innerHTML = `<div class="state-msg">Failed to load jobs. Please try again shortly.</div>`;
      return;
    }
    renderFilters();
    renderList();
  }

  if (!(routerStartParam && routerStartParam !== "all")) {
    loadJobs();
  }
</script>
</body>
</html>
